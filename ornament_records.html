<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="qstyles.css">
    <title>Ornament Occurrence Explorer</title>
    <style>
        body { 
            font-family: 'Georgia', serif; 
            margin: 40px auto; 
            max-width: 1050px; 
            color: #222222; 
            background-color: #fffcf4; 
            padding: 0 20px;
        }
        .explorer-nav { font-family: sans-serif; margin-bottom: 25px; font-size: 0.9rem; }
        .explorer-nav a { color: #800000; text-decoration: none; font-weight: bold; }
        .explorer-nav a:hover { text-decoration: underline; }
        
        h1 { font-family: sans-serif; color: #800000; font-weight: normal; margin-bottom: 5px; }
        .explorer-subtitle { font-family: sans-serif; font-size: 1.1rem; color: #555; margin-bottom: 30px; }
        
        .explorer-badge {
            display: inline-block;
            padding: 8px 12px;
            background-color: #f3f0e8;
            border-left: 4px solid #800000;
            font-family: sans-serif;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        table.explorer-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-family: sans-serif; 
            background: #fff;
            border-top: 2px solid #800000; 
            border-bottom: 2px solid #800000; 
            margin-top: 20px;
        }
        table.explorer-table th { background-color: #f3f0e8; color: #800000; font-weight: bold; padding: 12px; font-size: 0.9rem; text-transform: uppercase; }
        table.explorer-table td { padding: 15px; border-bottom: 1px solid #eaeaea; }
        
        .location-cell { font-weight: bold; color: #800000; width: 25%; text-align: left; vertical-align: top; }
        
        .hebrew-cell { 
            direction: rtl; 
            text-align: right; 
            font-family: 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif; 
            font-size: 1.6rem; 
            line-height: 2.2;
            width: 75%;
            padding-right: 20px;
    font-variant-ligatures: none;
    font-feature-settings: "ccmp" 1, "mark" 1, "mkmk" 1;
    text-rendering: optimizeLegibility;
        }
        
        /* 🏷️ THE GOLD ACCENT HIGHLIGHT RULE */
        .highlight-word {
            background-color: #fff2cc; 
            border-bottom: 2px dashed #d99600; 
            padding: 0 4px;
            border-radius: 3px;
            display: inline-block;
        }
.diacritic-control-panel {
    margin: 15px 0 25px 0;
    font-family: sans-serif;
    font-size: 0.95rem;
}
.toggle-switch {
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
}
.toggle-switch input {
    margin-right: 8px;
    accent-color: #800000; /* Sophisticated burgundy checkbox */
}
.toggle-label {
    color: #444;
    font-weight: bold;
}    
/* 🎯 THE LEXICAL UNIT HIGHLIGHT FIX (Yellow Background Block) */
/* When a parent word tracking container holds our target accent, highlight its background! */
.hebrew-cell span:has(.highlight-accent) {
    background-color: #fff59d;   /* A clean, highly legible soft pastel yellow block */
    padding: 0 4px;              /* Adds a small spatial margin cushion around the highlighted word */
    border-radius: 3px;          /* Smooths out the box border edges visually */
    display: inline-block;       /* Ensures the layout padding registers cleanly around the characters */
}

/* Keeps the target cantillation glyph accent mark sizing structurally clear and sharp */
.highlight-accent {
    font-size: 1.1em;
}

.highlight-accent-word {
    background-color: #fff3cd; /* Soft gold background highlight */
    border-radius: 3px;
    padding: 0 2px;
}
</style>
</head>
<body>

    <div class="explorer-nav">
        <a href="ornament_usage_by_pitch.html">← Back to Distribution Matrix</a>
    </div>

    <h1 id="page-title">Ornament Explorer</h1>
    <div class="explorer-subtitle" id="page-subtitle">Processing distribution lookup records...</div>

    <div id="explorer-status"></div>
<div class="diacritic-control-panel" style="display: flex; gap: 30px; align-items: center;">
    <label class="toggle-switch">
        <input type="checkbox" id="vowel-toggle" checked>
        <span class="toggle-label">Show Niqqud (Vowels)</span>
    </label>
    
    <!-- 📖 NEW BOOK FILTER DROPDOWN -->
    <label style="font-family: sans-serif; font-size: 0.95rem; color: #444; font-weight: bold;">
        Filter by Book:
        <select id="book-filter" style="margin-left: 8px; padding: 4px 8px; font-family: sans-serif; border: 1px solid #800000; border-radius: 4px; background-color: #fff;">
            <option value="all">-- All Books --</option>
        </select>
    </label>
</div>
    <table class="explorer-table">
        <thead>
            <tr>
                <th style="text-align: left; padding-left: 15px;">Location</th>
                <th style="text-align: right; padding-right: 15px;">Hebrew Text Segment</th>
            </tr>
        </thead>
        <tbody id="records-table-body">
            <!-- Records load here -->
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.hasLoadedRecords) return;
            window.hasLoadedRecords = true;

            const urlParams = new URLSearchParams(window.location.search);
            const targetOrnament = (urlParams.get('ornament') || '').trim().toLowerCase();
            const targetPitch = (urlParams.get('pitch') || '').trim();

            const pitchToHebrewName = {
                "c": "Darga", "d": "Tevir / Galgal", "e": "Silluq", "f": "Mercha",
                "g": "Tifha / D'khi", "A": "Atnah", "B": "Munach", "C": "Mahpach / Yetiv"
            };

            const traditionalName = pitchToHebrewName[targetPitch] || "Unknown Accent";

            document.getElementById('page-title').innerText = `Occurrences of ${targetOrnament.toUpperCase()}`;
            document.getElementById('page-subtitle').innerText = `Recitation Pitch: ${targetPitch} (${traditionalName})`;

            const recordsTable = document.getElementById('records-table-body');
            const statusContainer = document.getElementById('explorer-status');
            const bookFilter = document.getElementById('book-filter');
            const vowelToggle = document.getElementById('vowel-toggle'); // 🎯 Re-bound UI element

// 1. FULLY EXPANDED MAP WITH YOUR EXACT JSON/URL PARAMETER STRINGS
// Maps both single accents and your exact lower-case double-accent strings
const ornamentGlyphMap = {
    // --- Core Single Accents ---
    "segol": { isCompound: false, raw: "\u0592", entity: "&#1426;" },
    "shalshelet": { isCompound: false, raw: "\u0593", entity: "&#1427;" },
    "zaqef-qatan": { isCompound: false, raw: "\u0594", entity: "&#1428;" },
    "zaqef-gadol": { isCompound: false, raw: "\u0595", entity: "&#1429;" },
    "tifha": { isCompound: false, raw: "\u0596", entity: "&#1430;" },
    "revia": { isCompound: false, raw: "\u0597", entity: "&#1431;" },
    "zarqa": { isCompound: false, raw: "\u0598", entity: "&#1432;" },
    "pashta": { isCompound: false, raw: "\u0599", entity: "&#1433;" },
    "telisha-gedola": { isCompound: false, raw: "\u05A0", entity: "&#1440;" },
    "pazer": { isCompound: false, raw: "\u05A1", entity: "&#1441;" },
    "azla": { isCompound: false, raw: "\u059C", entity: "&#1436;" },
    "geresh": { isCompound: false, raw: "\u059C", entity: "&#1436;" }, // Synced with calling program
    "geresh-muqdam": { isCompound: false, raw: "\u059D", entity: "&#1437;" },
    "tarsin": { isCompound: false, raw: "\u059E", entity: "&#1438;" },
    "qarne-farah": { isCompound: false, raw: "\u059F", entity: "&#1439;" },
    "qadma": { isCompound: false, raw: "\u05A8", entity: "&#1448;" },
    "telisha-qetana": { isCompound: false, raw: "\u05A9", entity: "&#1449;" },
    "ole": { isCompound: false, raw: "\u05AB", entity: "&#1451;" },
    "illuy": { isCompound: false, raw: "\u05AC", entity: "&#1452;" },
    "tsinnor": { isCompound: false, raw: "\u05AE", entity: "&#1454;" },

    // --- Poetic Compound ---
    "revia-mugrash": {
        isCompound: true,
        unicodePattern: /[\u059D\u059C].*?\u0597|\u0597.*?[\u059D\u059C]/gu,
        htmlEntityPattern: /(&#1437;|&#1436;).*?&#1431;|&#1431;.*?(&#1437;|&#1436;)/g
    },

// --- Decalogue & Unique Double Accents ---
// Updated regex constraints allow any number of intermediate characters (consonants/vowels) 
// to sit between the two targeted musical ornaments.

"revia z-qatan": {
    isCompound: true,
    unicodePattern: /(?=.*\u0597)(?=.*\u0594)/gu, // Employs lookaheads: word contains BOTH marks
    htmlEntityPattern: /(?=.*&#1431;)(?=.*&#1428;)/g
},
"z-gadol pashta": {
    isCompound: true,
    // Fixes the wedge bug: allows consonants to separate the Zaqef-Gadol and Pashta marks
    unicodePattern: /(?=.*\u0595)(?=.*\u0599)/gu, 
    htmlEntityPattern: /(?=.*&#1429;)(?=.*&#1433;)/g
},
"pashta pashta": {
    isCompound: true,
    // Ensures the same word includes at least TWO distinct instances of Pashta
    unicodePattern: /\u0599.*\u0599/gu, 
    htmlEntityPattern: /&#1433;.*&#1433;/g
},
"pazer azla": {
    isCompound: true,
    unicodePattern: /(?=.*\u05A1)(?=.*\u059C)/gu,
    htmlEntityPattern: /(?=.*&#1441;)(?=.*&#1436;)/g
},
"pazer z-qatan": {
    isCompound: true,
    unicodePattern: /(?=.*\u05A1)(?=.*\u0594)/gu,
    htmlEntityPattern: /(?=.*&#1441;)(?=.*&#1428;)/g
},
"z-qatan azla": {
    isCompound: true,
    unicodePattern: /(?=.*\u0594)(?=.*\u059C)/gu,
    htmlEntityPattern: /(?=.*&#1428;)(?=.*&#1436;)/g
},
"z-qatan tsinnor": {
    isCompound: true,
    unicodePattern: /(?=.*\u0594)(?=.*\u05AE)/gu,
    htmlEntityPattern: /(?=.*&#1428;)(?=.*&#1454;)/g
},
"azla pashta": {
    isCompound: true,
    unicodePattern: /(?=.*\u059C)(?=.*\u0599)/gu,
    htmlEntityPattern: /(?=.*&#1436;)(?=.*&#1433;)/g
},
"azla t-qetana": {
    isCompound: true,
    unicodePattern: /(?=.*\u059C)(?=.*\u05A9)/gu,
    htmlEntityPattern: /(?=.*&#1436;)(?=.*&#1449;)/g
},
"z-qatan pazer": {
    isCompound: true,
    unicodePattern: /(?=.*\u0594)(?=.*\u05A1)/gu,
    htmlEntityPattern: /(?=.*&#1428;)(?=.*&#1441;)/g
},
"azla z-qatan": {
    isCompound: true,
    unicodePattern: /(?=.*\u059C)(?=.*\u0594)/gu,
    htmlEntityPattern: /(?=.*&#1436;)(?=.*&#1428;)/g
},
"tarsin revia": {
    isCompound: true,
    unicodePattern: /(?=.*\u059E)(?=.*\u0597)/gu,
    htmlEntityPattern: /(?=.*&#1438;)(?=.*&#1431;)/g
},
"geresh t-gedola": {
    isCompound: true,
    unicodePattern: /(?=.*\u059C)(?=.*\u05A0)/gu,
    htmlEntityPattern: /(?=.*&#1436;)(?=.*&#1440;)/g
},
"telisha-gedola azla": {
    isCompound: true,
    unicodePattern: /(?=.*\u05A0)(?=.*\u059C)/gu,
    htmlEntityPattern: /(?=.*&#1440;)(?=.*&#1436;)/g
}
};


            // 📖 Book name text string maps to Oracle sequential integer index numbers
            const bookNumberMap = {
                "Genesis": 1, "Exodus": 2, "Leviticus": 3, "Numbers": 4, "Deuteronomy": 5,
                "Joshua": 6, "Judges": 7, "1 Samuel": 8, "2 Samuel": 9, "1 Kings": 10,
                "2 Kings": 11, "Isaiah": 12, "Jeremiah": 13, "Ezekiel": 14, "Hosea": 15,
                "Joel": 16, "Amos": 17, "Obadiah": 18, "Jonah": 19, "Micah": 20,
                "Nahum": 21, "Habakkuk": 22, "Zephaniah": 23, "Haggai": 24, "Zechariah": 25,
                "Malachi": 26, "Psalms": 27, "Proverbs": 28, "Job": 29, "Song of Songs": 30,
                "Ruth": 31, "Lamentations": 32, "Ecclesiastes": 33, "Esther": 34, "Daniel": 35,
                "Ezra": 36, "Nehemiah": 37, "1 Chronicles": 38, "2 Chronicles": 39
            };

            // 🌐 FETCH ENGINE: Loads all data resources cleanly via asynchronous background promises
            Promise.all([
                fetch('ornament_index.json').then(res => res.json()),
                fetch('translation.json').then(res => res.json()),
                fetch('interlin.json').then(res => res.json())
            ])
            .then(([indexData, englishData, interlinData]) => {
                
                const actualOrnamentKey = Object.keys(indexData).find(
                    key => key.trim().toLowerCase() === targetOrnament
                );

                let allMatches = [];
                if (actualOrnamentKey && indexData[actualOrnamentKey]) {
                    allMatches = indexData[actualOrnamentKey][targetPitch] || [];
                }
                
                if (allMatches.length === 0) {
                    statusContainer.innerHTML = '<div class="explorer-badge">No records found matching this configuration.</div>';
                    return;
                }

                // Canonical Sorting Order (Genesis -> Chronicles)
                allMatches.sort((a, b) => {
                    if (a.s !== b.s) return a.s - b.s;
                    if (parseInt(a.c) !== parseInt(b.c)) return parseInt(a.c) - parseInt(b.c);
                    return parseInt(a.v) - parseInt(b.v);
                });

                // Populate Book Filter Dropdown
                const uniqueBooks = [];
                allMatches.forEach(item => {
                    if (!uniqueBooks.includes(item.b)) uniqueBooks.push(item.b);
                });
                
                uniqueBooks.forEach(book => {
                    const opt = document.createElement('option');
                    opt.value = book;
                    opt.innerText = book;
                    bookFilter.appendChild(opt);
                });


                // MAP 1: Map Oracle translation items strictly by nested query index
                const englishLookupMap = {};
                if (englishData && englishData.results && englishData.results[0] && englishData.results[0].items) {
                    englishData.results[0].items.forEach(item => {
                        const bSeq = parseInt(item.book_seq_no);
                        const cKey = String(item.chapter_cd).padStart(3, '0');
                        const vKey = String(item.verse_cd).padStart(3, '0');
                        englishLookupMap[`${bSeq}_${cKey}:${vKey}`] = item.eng_text || "";
                    });
                }

                // MAP 2: Map interlin database components directly by their exact native "k" keys
                const niqqudLookupMap = {};
                if (interlinData && interlinData.items) {
                    interlinData.items.forEach(item => {
                        if (item.k && item.h) {
                            niqqudLookupMap[item.k.trim()] = item.h.trim();
                        }
                    });
                }
                // 🧠 CACHE COMPILATION LOOP (Generates layouts accurately ahead of rendering calls)
                const recordsCache = [];
                
                // Define the absolute native Unicode glyph representations for structural pause tracking
                const zaqefGlyph  = "\u0594"; // ֔ (Zaqef-Qatan)
                const atnahGlyph  = "\u0591"; // ֑ (Atnah)

                allMatches.forEach(item => {
                    // Extract the text that already contains the vowels from your main database file
                    const rawText = item.t && item.t.trim() ? item.t : "";
                    if (!rawText) {
                        const errMsg = `<span style="color:#aaa; font-style:italic; font-size:1rem;">Text element missing inside data file node</span>`;
                        recordsCache.push({ book: item.b, location: `${item.b} ${item.c}:${item.v}`, withVowels: errMsg, withoutVowels: errMsg });
                        return;
                    }

                    // Build lookup keys for the English translation matching your Oracle tables
                    const bSeqNum = bookNumberMap[item.b] || 0;
                    const cKey = String(item.c).padStart(3, '0');
                    const vKey = String(item.v).padStart(3, '0');
                    
                    // DECALOGUE COORDINATE PATCH: Adjusts potential coordinate mismatches in Exodus 20 and Deut 5
                    let englishToken = `${bSeqNum}_${cKey}:${vKey}`;
                    let fullEnglishTranslation = englishLookupMap[englishToken];

                    if (!fullEnglishTranslation) {
                        // Fallback logic for potential Decalogue alternate verse schemes
                        if (bSeqNum === 2 && cKey === "020") { // Exodus 20
                            const altVerse = String(parseInt(item.v) + 1).padStart(3, '0'); 
                            fullEnglishTranslation = englishLookupMap[`${bSeqNum}_${cKey}:${altVerse}`];
                        } else if (bSeqNum === 5 && cKey === "005") { // Deuteronomy 5
                            const altVerse = String(parseInt(item.v) + 1).padStart(3, '0');
                            fullEnglishTranslation = englishLookupMap[`${bSeqNum}_${cKey}:${altVerse}`];
                        }
                    }
                    
                    // Final string validation wrap
                    fullEnglishTranslation = (fullEnglishTranslation || "Translation missing").replace(/"/g, '&quot;');

                    // Clean lingering spacing glitches around hyphens/Maqafs cleanly on the raw base string
                    let cleanBaseText = rawText.replace(/[\s\u00A0]*[־\-][\s\u00A0]*/g, '־');

                    // 🎯 FIX: Apply the structural pauses directly to the RAW text before wrapping words!
                    // This ensures Maqafs and spaces are evaluated at the exact character position.
                    
                    // A. Inject comma directly after the Zaqef-Qatan word boundary
                    if (cleanBaseText.includes(zaqefGlyph)) {
                        const zaqefRegex = new RegExp(`([^\\s־]*${zaqefGlyph}[^\\s־]*)`, 'g');
                        cleanBaseText = cleanBaseText.replace(zaqefRegex, '$1,');
                    }

                    // B. Inject the <br> line break directly after the Atnah word boundary
                    if (cleanBaseText.includes(atnahGlyph)) {
                        const atnahRegex = new RegExp(`([^\\s־]*${atnahGlyph}[^\\s־]*)`, 'g');
                        cleanBaseText = cleanBaseText.replace(atnahRegex, '$1<br>');
                    }


// 2. ULTRA-LEAN EXTRACTOR
// Directly reads the incoming URL param (decoded natively by the browser)
const rawParam = urlParams.get('ornament'); 
const target = rawParam ? ornamentGlyphMap[rawParam.toLowerCase().trim()] : null;

// 3. WORD PARSING ENGINE
const structuralWordsArray = cleanBaseText.split(/(\s+|<br[^>]*>)/i);
const processedWordsArray = structuralWordsArray.map(word => {
    if (/^\s*$/g.test(word) || /<br[^>]*>/i.test(word)) {
        return word;
    }

    let isMatch = false;

    if (target) {
        if (target.isCompound) {
            // Test if BOTH targets exist inside the string layout
            isMatch = target.unicodePattern.test(word) || target.htmlEntityPattern.test(word);
        } else {
            // Standard single-accent match
            isMatch = word.includes(target.raw) || word.includes(target.entity);
        }
    }

    if (isMatch) {
        return `<span class="highlight-accent-word">${word}</span>`;
    }
    return `<span>${word}</span>`;
});


                    // Re-stitch our clean structural textual layout foundation
                    let compiledBaseString = processedWordsArray.join(' ');

                    // ==========================================
                    // 3. TRACK A: FULLY VOWELED VIEW (Maintains Highlights + Niqqud)
                    // ==========================================
                    let voweledTrackOutput = compiledBaseString;

                    // ==========================================
                    // 4. TRACK B: CANTORIAL DISPLAY VIEW (Selective Niqqud + Shin Dot Stripping)
                    // ==========================================
                    let plainTrackOutput = compiledBaseString;

                    // 🎯 VOWELS & PRONUNCIATION DOTS ONLY (Preserves Cantillation Accents \u0591-\u05AF)
                    // \u05B0-\u05BB -> All standard Hebrew vowel points (Niqqud)
                    // \u05BC        -> Dagesh or Mapiq (emphasis dot)
                    // \u05C1-\u05C2 -> Shin and Sin diacritic dots
                    // \u05C7        -> Qamats Qatan
                    const stripVowelsOnlyRegex = /[\u05B0-\u05BB\u05BC\u05C1\u05C2\u05C7]/gu;

                    // 1. Decompose the string to decouple stacked marks safely
                    plainTrackOutput = plainTrackOutput.normalize("NFD");

                    // 2. Erase the vowels directly (remove span code wrapper if text is not inside <span>)
                    plainTrackOutput = plainTrackOutput.replace(stripVowelsOnlyRegex, '');

                    // ==========================================
                    // 5. WRAPPER ELEMENT ASSEMBLY
                    // ==========================================
                    const wrapWithoutVowels = `<div title="${fullEnglishTranslation}" style="cursor:help; display:inline-block; width:100%; line-height: 1.8;">${plainTrackOutput}</div>`;
                    const wrapWithVowels = `<div title="${fullEnglishTranslation}" style="cursor:help; display:inline-block; width:100%; line-height: 1.8;">${voweledTrackOutput}</div>`;

                    recordsCache.push({
                        book: item.b,
                        location: `${item.b} ${item.c}:${item.v}`,
                        withVowels: wrapWithVowels,      // Checked State (Vowels, All Accents, Shin Dots, and <br>)
                        withoutVowels: wrapWithoutVowels // Unchecked State (Initial Display: No Vowels, No Shin Dots, Highlighting, and <br>)
                    });
                });

                // ⚙️ LIVE RENDERING & FILTERING ENGINE
                function drawTableRows() {
                    const selectedBook = bookFilter.value;
                    
                    // 🎯 INITIAL DISPLAY FIX: Default to false (unchecked layout format) if element properties miss definition values
                    const showVowels = vowelToggle ? vowelToggle.checked : false; 
                    
                    const filteredRecords = recordsCache.filter(item => {
                        return selectedBook === 'all' || item.book === selectedBook;
                    });

                    const displayLimit = 150;
                    statusContainer.innerHTML = `<div class="explorer-badge">Showing ${Math.min(filteredRecords.length, displayLimit)} of ${filteredRecords.length} filtered rows.</div>`;

                    const htmlBuffer = [];
                    filteredRecords.slice(0, displayLimit).forEach(item => {
                        const activeText = showVowels ? item.withVowels : item.withoutVowels;
                        htmlBuffer.push(`
                            <tr>
                                <td class="location-cell">${item.location}</td>
                                <td class="hebrew-cell" style="direction: rtl; text-align: right;">${activeText}</td>
                            </tr>
                        `);
                    });
                    recordsTable.innerHTML = htmlBuffer.join('');
                }

                bookFilter.addEventListener('change', drawTableRows);
                if (vowelToggle) {
                    vowelToggle.addEventListener('change', drawTableRows);
                }
                
                // Initial execution call draws the layout smoothly right away
                drawTableRows();
            })
            .catch(err => {
                console.error("Fetch Data Loop Crash:", err);
                statusContainer.innerHTML = '<div class="explorer-badge" style="color:red;">Error loading resource data libraries.</div>';
            });
        });

    </script>

</body>
</html>
