<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="qstyles.css">
  <title>Chapter Ornament Explorer</title>
  <style>
    body { font-family: Georgia, serif; margin: 40px auto; max-width: 1050px; color: #222; background: #fffcf4; padding: 0 20px; line-height: 1.6; }
    a { color: #800000; }
    .nav, .controls, .summary { font-family: sans-serif; }
    .nav { margin-bottom: 25px; font-size: .9rem; font-weight: bold; }
    h1 { color: #800000; font: normal 2.1rem sans-serif; margin-bottom: .25rem; }
    .controls, .summary { margin: 20px 0; padding: 14px 18px; background: #f3f0e8; border-left: 4px solid #800000; }
    label { cursor: pointer; }
    .verse { margin: 26px 0; padding: 18px 20px; background: white; border-top: 2px solid #800000; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .verse-heading { display: flex; justify-content: space-between; gap: 1rem; font: bold 1rem sans-serif; color: #800000; }
    .hebrew { direction: rtl; text-align: right; font: 1.75rem/2.1 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif; margin: .6rem 0 1rem; }
    .occurrences { font-family: sans-serif; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; direction: rtl; }

    .chip { display: inline-block; border: 1px solid #800000; border-radius: 14px; padding: 3px 9px; background: #fff9e8; text-decoration: none; font-size: .9rem; }
    .quiet { color: #666; font-style: italic; }
    .error { color: #800000; font-family: sans-serif; padding: 18px; background: #fff0f0; }
  </style>
</head>
<body>
  <nav class="nav"><a href="ornament_usage_by_pitch.html">← Ornament usage by recitation pitch</a></nav>
  <h1 id="title">Chapter Ornament Explorer</h1>
  <p id="subtitle">Loading the chapter’s musical profile…</p>
  <div class="controls">
    <label><input id="vowel-toggle" type="checkbox"> Show vowel points (niqqud)</label>
<label style="margin-left: 20px; font-weight: normal; cursor: pointer; color: #800000;">
    <input type="checkbox" id="gematria-toggle"> Show Gematria Profiles
</label>

  </div>
  <div id="summary" class="summary" hidden></div>
  <main id="chapter"></main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedBook = (params.get('book') || '').trim().toLowerCase();
    const requestedChapter = String(parseInt(params.get('chapter'), 10));
    const chapterRoot = document.getElementById('chapter');
    const vowelToggle = document.getElementById('vowel-toggle');
    const gematriaToggle = document.getElementById('gematria-toggle');
    let activeChapter = null;
    vowelToggle.checked = false; 
    gematriaToggle.checked = false; 
    function consonantsAndTeamim(text) {
      // Remove vowels and dot points, but preserve cantillation marks.
      return text.replace(/[\u05B0-\u05BB\u05BC\u05C1\u05C2\u05C7]/g, '');
    }

    function chapterSummary(chapter) {
      const counts = new Map();
      chapter.verses.forEach(verse => verse.ornaments.forEach(item => {
        const key = `${item.n} (${item.p})`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }));
      return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    }

    function toProperCaseFilename(str) {
      return str
        .toLowerCase()
        .split(/[\s_]+/) // Splits on both spaces and underscores
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join('_');     // Rejoins with underscores for the filename
    }    
    function render() {
      if (!activeChapter) return;
      const showVowels = vowelToggle.checked;
      
      // Fetch the state of our new toggle safely
      const showGematria = gematriaToggle ? gematriaToggle.checked : false;
      
      chapterRoot.replaceChildren();
      activeChapter.verses.forEach(verse => {
        const section = document.createElement('section');
        section.className = 'verse';
        const heading = document.createElement('div');
        heading.className = 'verse-heading';
        heading.textContent = `${activeChapter.b} ${activeChapter.c}:${verse.v}`;
        const text = document.createElement('div');
        text.className = 'hebrew';
        text.textContent = showVowels ? verse.t : consonantsAndTeamim(verse.t);
        const occurrences = document.createElement('div');
        occurrences.className = 'occurrences';
        if (verse.ornaments.length === 0) {
          occurrences.innerHTML = '<span class="quiet">No ornament occurrence recorded for this verse.</span>';
        } else {
          const unique = new Map();
          verse.ornaments.forEach(item => {
            const key = `${item.n}|${item.p}`;
            unique.set(key, { ...item, count: (unique.get(key)?.count || 0) + 1 });
          });
          unique.forEach(item => {
            const link = document.createElement('a');
            link.className = 'chip';
            link.href = `ornament_records.html?ornament=${encodeURIComponent(item.n)}&pitch=${encodeURIComponent(item.p)}`;
            link.textContent = `${item.n} · ${item.p}${item.count > 1 ? ` ×${item.count}` : ''}`;
            link.title = 'Open every occurrence in the ornament concordance';
            occurrences.append(link);
          });
        }
        
        // --- RESTORED AUDIO PIPELINE VARIABLES ---
        // 1. Keep raw spaces for the parent directory (e.g., "1 CHRONICLES")
        const rawBookCode = activeChapter.b.toUpperCase().trim(); 
        
        // 2. Generate the underscore filename (e.g., "1_Chronicles_1_1.mp3")
        const properBookName = toProperCaseFilename(rawBookCode);
        const audioFileName = `${properBookName}_${activeChapter.c}_${verse.v}`;
        const audioUrl = `musicscores/audio/${rawBookCode}/${audioFileName}.mp3`;

        const audioContainer = document.createElement('div');
        audioContainer.style.marginTop = '12px';
        audioContainer.style.direction = 'ltr'; // Keeps the audio player controls left-to-right
        
        audioContainer.innerHTML = `
          <audio controls preload="none" style="width: 100%; max-width: 250px; height: 32px; display: block;">
            <source src="${audioUrl}" type="audio/mpeg">
          </audio>
        `;

        // Append your primary music components to the section first
        section.append(heading, text, occurrences, audioContainer);

        // ===================================================================
        // OPTIMIZED TOGGLE CONDITIONAL: Only build and append if checked
        // ===================================================================
        if (showGematria) {
            const gematriaMap = {
            'א': 1, 'ב': 2, 'ג': 3, 'ד': 4, 'ה': 5, 'ו': 6, 'ז': 7, 'ח': 8, 'ט': 9,
            'י': 10, 'כ': 20, 'ך': 20, 'ל': 30, 'מ': 40, 'ם': 40, 'נ': 50, 'ן': 50,
            'ס': 60, 'ע': 70, 'פ': 80, 'ף': 80, 'צ': 90, 'ץ': 90, 'ק': 100, 'ר': 200,
            'ש': 300, 'ת': 400
            };

            let verseSum = 0;
            let wordValues = []; 
            const rawText = verse.t || "";
        
            // Split by standard whitespace (\s, which includes \n) and the Maqaf (־)
            const wordsArray = rawText.split(/[\s־|]+/);
    
            wordsArray.forEach(word => {
                let wordSum = 0;
            
                // Look at each character in the word string directly
                for (let i = 0; i < word.length; i++) {
                    let char = word.charAt(i);
                
                    // Directly check if the character is one of our 22 square consonants
                    if (gematriaMap[char]) {
                        wordSum += gematriaMap[char];
                    }
                }
            
                if (wordSum > 0) {
                    verseSum += wordSum;
                    wordValues.push(wordSum);
                }
            });

            // ALL GLOBAL VERSE TEXT STRUCTURING PIECES SIT SAFELY OUTSIDE HERE:
            const rtlWordArithmeticTrace = wordValues.reverse().join(" + ");

            let tempNum = verseSum;
            let factorSet = new Set();
            let divisor = 2;
            while (divisor * divisor <= tempNum) {
                while (tempNum % divisor === 0) {
                    factorSet.add(divisor);
                    tempNum = Math.floor(tempNum / divisor);
                }
                divisor++;
            }
            if (tempNum > 1) {
                factorSet.add(tempNum);
            }
            const formattedFactors = Array.from(factorSet).sort((a,b) => a - b).join(", ");

            const gematriaContainer = document.createElement('div');
            gematriaContainer.style.marginTop = '12px';
            gematriaContainer.style.paddingTop = '8px';
            gematriaContainer.style.borderTop = '1px dashed #eee'; 
            gematriaContainer.style.fontSize = '12px';
            gematriaContainer.style.color = '#555';
            gematriaContainer.style.direction = 'ltr'; 
        
            let colorClass = "gem-low";
            if (verseSum >= 600) colorClass = "gem-high";
            else if (verseSum >= 400) colorClass = "gem-mid-high";
            else if (verseSum >= 200) colorClass = "gem-mid";
            else if (verseSum >= 50) colorClass = "gem-mid-low";

            gematriaContainer.innerHTML = `
              <div style="margin-bottom: 4px;">
                <span style="font-weight: bold; margin-right: 15px;">
                  Gematria: <span class="${colorClass}" style="padding: 2px 6px; border-radius: 4px; font-weight: bold;">${verseSum}</span>
                </span>
                <span style="font-family: monospace; color: #800000;">
                  Factors: ( ${formattedFactors || 'None'} )
                </span>
              </div>
              <div style="font-family: monospace; font-size: 11px; color: #666; word-break: break-all; margin-top: 4px;">
                Word weights (Right to Left): ${rtlWordArithmeticTrace || '0'}
              </div>
            `;
        
            section.append(gematriaContainer);
            // ===================================================================
        }
        // ===================================================================

        chapterRoot.append(section);
      });
    }
    if (!requestedBook || !Number.isInteger(Number(requestedChapter))) {
      chapterRoot.innerHTML = '<p class="error">Choose a book and chapter from the ornament usage page.</p>';
    } else {
      fetch('ornament_chapters.json')
        .then(response => response.ok ? response.json() : Promise.reject(new Error('chapter index unavailable')))
        .then(data => {
          
          // Cleanly separate the search loop out so it runs flawlessly
          activeChapter = data.chapters.find(item => {
              if (item.b.toLowerCase() === requestedBook && String(item.c) === requestedChapter) {
                  return true; 
              }
              return false;
          });          
          
          // Fixed formatting gap prevents the script from crashing here:
          if (!activeChapter) {
              throw new Error('chapter not found');
          }
          
          document.title = `${activeChapter.b} ${activeChapter.c} — Chapter Ornament Explorer`;
          document.getElementById('title').textContent = `${activeChapter.b} ${activeChapter.c}: Ornament Profile`;
          
          const total = activeChapter.verses.reduce((sum, verse) => sum + verse.ornaments.length, 0);
          document.getElementById('subtitle').textContent = `${activeChapter.verses.length} verses; ${total} ornament/pitch occurrences.`;
          
          const summary = document.getElementById('summary');
          summary.textContent = chapterSummary(activeChapter).map(([key, count]) => `${key}${count > 1 ? ` ×${count}` : ''}`).join(' · ');
          summary.hidden = false;
          
          render();
        })
        .catch((err) => {
          console.error("Gematria Fetch Error Trace:", err); // Prints error to console log for easier debugging
          chapterRoot.innerHTML = '<p class="error">This chapter is not available in the ornament index yet.</p>';
          document.getElementById('subtitle').textContent = 'Check the book and chapter, then try again.';
        });
    }
    vowelToggle.addEventListener('change', render);
    gematriaToggle.addEventListener('change', render);
// Lightweight Experiment Module for ornament_chapter.html
  </script>
</body>
</html>
