<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Concordance (Verse Twins)</title>
    <link rel="stylesheet" type="text/css" href="qstyles.css"/>
    <style>
        .filter-panel { 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            background: #fdfaf4; 
            padding: 12px 16px; 
            margin: 0 auto 15px auto; 
            width: calc(100% - 32px); 
            border: 1px solid #800000; 
            border-bottom: 3px solid #800000;
            border-radius: 0 0 6px 6px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .filter-select { 
            padding: 6px 10px; 
            font-family: monospace; 
            font-size: 14px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            background: white;
        }
        .factor-tag { 
            font-family: monospace; 
            font-weight: bold; 
            color: #800000; 
            letter-spacing: 0.5px; 
        }
        .sticky-thead th {
            position: sticky;
            top: 68px; 
            z-index: 90;
            background-color: #f3f0e8;
            color: #800000;
            font-weight: bold;
            padding: 10px 12px;
            border-bottom: 2px solid #800000;
            text-align: left;
        }
        .hebrew-cell {
            font-family: "SBL Hebrew", "Ezra SIL", "Times New Roman", serif;
            font-size: 20px;
            direction: rtl;
            text-align: right;
            display: inline-block;
            width: calc(100% - 220px);
            line-height: 1.6;
            vertical-align: middle;
        }
        .verse-entry {
            margin-bottom: 8px; 
            padding-bottom: 6px; 
            border-bottom: 1px dashed #e0dcd3;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .verse-entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .verse-link {
            font-weight: bold; 
            color: #800000; 
            text-decoration: none; 
            min-width: 180px;
            display: inline-block;
        }
        .verse-link:hover { text-decoration: underline; }
        
        /* Pagination Controls */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            margin: 15px auto;
            width: calc(100% - 32px);
            background: #fdfaf4;
            border: 1px solid #dcd7cd;
            border-radius: 4px;
        }
        .page-btn {
            padding: 6px 14px;
            background: #800000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #loadingNotice {
            font-family: monospace;
            font-size: 16px;
            color: #800000;
            font-weight: bold;
            text-align: center;
            padding: 30px;
        }
    </style>
    <script src="./menu.js" defer></script>
</head>
<body>

    <h1 style="margin-left:16px; margin-bottom:4px; color:#800000;">Co-Inherent Verse Weights</h1>
    <p style="margin-left:16px; margin-top:0; color:#555;">
        Sorted by Maximum Prime Factor (Largest First). Click a reference to open the chapter view.
    </p>

    <!-- STICKY FILTER BAR -->
    <div class="filter-panel">
        <strong style="color:#800000;">Filters:</strong>
        
        <select id="factorFilter" class="filter-select" onchange="onFilterChange()">
            <option value="">-- All Factors --</option>
        </select>

        <!-- 🎯 NEW: Exclusive Factor Checkbox -->
        <label style="font-size: 13px; color: #444; cursor: pointer; user-select: none;">
            <input type="checkbox" id="exclusiveFactor" onchange="onFilterChange()" style="vertical-align: middle; margin-right: 4px;">
            Exclusive (only this factor)
        </label>

        <select id="bookFilter" class="filter-select" onchange="onFilterChange()">
            <option value="">-- All Books --</option>
        </select>

        <button onclick="clearFilters()" class="page-btn" style="background:#555;">Reset</button>

        <span id="matchStats" style="margin-left:auto; font-weight:bold; color:#444; font-size:14px;"></span>
    </div>

    <!-- PAGINATION BAR (TOP) -->
    <div class="pagination-bar">
        <button id="prevBtn" class="page-btn" onclick="changePage(-1)">◀ Previous</button>
        <span id="pageInfo" style="font-weight:bold; color:#333;"></span>
        <button id="nextBtn" class="page-btn" onclick="changePage(1)">Next ▶</button>
    </div>

    <div id="loadingNotice">Loading Gematria Concordance data (~5 MB)...</div>

    <!-- TABLE -->
    <table id="concordanceTable" class="btable" style="width: calc(100% - 32px); margin: 0 auto; border-collapse: collapse; display: none;">
        <thead class="sticky-thead">
            <tr>
                <th style="width: 12%;">Weight (Sum)</th>
                <th style="width: 18%;">Factors [x]</th>
                <th style="width: 70%;">Twin Verse Co-Inherences</th>
            </tr>
        </thead>
        <tbody id="concordanceBody"></tbody>
    </table>

    <!-- PAGINATION BAR (BOTTOM) -->
    <div id="bottomPagination" class="pagination-bar" style="display: none;">
        <button id="prevBtnBtm" class="page-btn" onclick="changePage(-1)">◀ Previous</button>
        <span id="pageInfoBtm" style="font-weight:bold; color:#333;"></span>
        <button id="nextBtnBtm" class="page-btn" onclick="changePage(1)">Next ▶</button>
    </div>

    <script>
        let allGroups = [];
        let filteredGroups = [];
        let currentPage = 1;
        const PAGE_SIZE = 50;

        // 1. Load the 5 MB JSON file asynchronously
        fetch('gematria_verse_twins.json')
            .then(response => {
                if (!response.ok) throw new Error("Could not load gematria_verse_twins.json");
                return response.json();
            })
            .then(data => {
                document.getElementById('loadingNotice').style.display = 'none';
                document.getElementById('concordanceTable').style.display = 'table';
                document.getElementById('bottomPagination').style.display = 'flex';

                allGroups = data.groups || [];
                filteredGroups = allGroups;

                // Populate Dropdowns
                const factorSelect = document.getElementById('factorFilter');
                (data.unique_factors || []).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = `Factor: [${f}]`;
                    factorSelect.appendChild(opt);
                });

                const bookSelect = document.getElementById('bookFilter');
                (data.books || []).forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b;
                    opt.textContent = b;
                    bookSelect.appendChild(opt);
                });

                renderCurrentPage();
            })
            .catch(err => {
                document.getElementById('loadingNotice').textContent = "Error: " + err.message;
            });

        // 2. High-speed in-memory filter
        function onFilterChange() {
            const selectedFactor = document.getElementById('factorFilter').value;
            const isExclusive = document.getElementById('exclusiveFactor').checked;
            const selectedBook = document.getElementById('bookFilter').value;

            const factorNum = selectedFactor ? parseInt(selectedFactor, 10) : null;
            const bookToken = selectedBook ? `[${selectedBook}]` : null;

            filteredGroups = allGroups.filter(g => {
                let factorOk = true;

                if (factorNum !== null) {
                    if (isExclusive) {
                        // 🎯 Only match groups whose SOLE prime factor is this number
                        factorOk = g.factors && g.factors.length === 1 && g.factors[0] === factorNum;
                    } else {
                        // Standard match: contains this factor among others
                        factorOk = g.factors && g.factors.includes(factorNum);
                    }
                }

                const bookOk = bookToken === null || (g.group_books && g.group_books.includes(bookToken));
                return factorOk && bookOk;
            });

            currentPage = 1;
            renderCurrentPage();
        }

        function clearFilters() {
            document.getElementById('factorFilter').value = "";
            document.getElementById('exclusiveFactor').checked = false; // 🎯 Reset checkbox
            document.getElementById('bookFilter').value = "";
            filteredGroups = allGroups;
            currentPage = 1;
            renderCurrentPage();
        }
        // 3. Render only the current slice (50 groups) into the DOM
        function renderCurrentPage() {
            const totalGroups = filteredGroups.length;
            const totalPages = Math.ceil(totalGroups / PAGE_SIZE) || 1;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * PAGE_SIZE;
            const endIdx = Math.min(startIdx + PAGE_SIZE, totalGroups);
            const currentSlice = filteredGroups.slice(startIdx, endIdx);

            const selectedBook = document.getElementById('bookFilter').value;

            let html = "";
            for (let i = 0; i < currentSlice.length; i++) {
                const g = currentSlice[i];
                const bracketedFactors = (g.factors || []).map(f => `[${f}]`).join(" ");

                let versesHtml = "";
                for (let j = 0; j < (g.records || []).length; j++) {
                    const r = g.records[j];
                    // If a book is filtered, only highlight/show that book's verses in the group
                    if (selectedBook && r.book !== selectedBook) continue;

                    versesHtml += `
                        <div class="verse-entry">
                            <a class="verse-link" href="${r.link}" target="_blank">${r.label} ↗</a>
                            <span class="hebrew-cell">${r.text}</span>
                        </div>
                    `;
                }

                html += `
                    <tr style="border-bottom: 1px solid #dcd7cd; vertical-align: top;">
                        <td style="padding: 12px 10px;">
                            <span style="font-weight:bold; color:#800000; font-size:16px;">${g.sum_val}</span>
                        </td>
                        <td style="padding: 12px 10px;" class="factor-tag">
                            ${bracketedFactors}
                        </td>
                        <td style="padding: 12px 10px;">
                            ${versesHtml}
                        </td>
                    </tr>
                `;
            }

            document.getElementById('concordanceBody').innerHTML = html;

            // Update stats and pagination controls
            const statsText = totalGroups === 0 
                ? "No matching groups" 
                : `Showing ${startIdx + 1}–${endIdx} of ${totalGroups.toLocaleString()} matching groups`;
            document.getElementById('matchStats').textContent = statsText;

            const pageLabel = `Page ${currentPage} of ${totalPages.toLocaleString()}`;
            document.getElementById('pageInfo').textContent = pageLabel;
            document.getElementById('pageInfoBtm').textContent = pageLabel;

            const atFirst = currentPage === 1;
            const atLast = currentPage >= totalPages;

            document.getElementById('prevBtn').disabled = atFirst;
            document.getElementById('prevBtnBtm').disabled = atFirst;
            document.getElementById('nextBtn').disabled = atLast;
            document.getElementById('nextBtnBtm').disabled = atLast;
        }

        function changePage(direction) {
            currentPage += direction;
            renderCurrentPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
