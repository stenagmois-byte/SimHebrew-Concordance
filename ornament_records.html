<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="qstyles.css">
    <title>Ornament Records — Tanach Concordance</title>
    <style>
        body { font-family: 'Georgia', serif; margin: 30px auto; max-width: 1050px; color: #222222; line-height: 1.6; background-color: #fffcf4; padding: 0 15px; }
        .nav { margin-bottom: 20px; font-family: sans-serif; font-size: 0.9rem; }
        .nav a { color: #800000; text-decoration: none; font-weight: bold; }
        .nav a:hover { text-decoration: underline; }
        h1 { font-family: sans-serif; color: #800000; font-size: 2.0rem; margin-bottom: 10px; font-weight: normal; }
        .verse-card { margin-bottom: 22px; padding: 16px 20px; background: #ffffff; border: 1px solid #e2ddd0; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
        .verse-header-line { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f2eee5; padding-bottom: 8px; margin-bottom: 12px; }
        .verse-title { font-family: sans-serif; font-size: 1.1rem; font-weight: bold; color: #800000; }
        .verse-text { direction: rtl; text-align: right; font-family: 'SBL Hebrew', 'Ezra SIL', serif; font-size: 1.55rem; line-height: 1.9; color: #111; margin-bottom: 12px; }
        .verse-badges-row { direction: rtl; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; margin-bottom: 12px; }
        .accent-badge { display: inline-flex; align-items: center; gap: 6px; background: #f6f3eb; border: 1px solid #dcd4c3; border-radius: 4px; padding: 3px 9px; font-family: sans-serif; font-size: 0.82rem; }
        .badge-sign { font-family: 'SBL Hebrew', serif; font-size: 1.15rem; color: #800000; font-weight: normal; }
        .badge-pitch { background: #800000; color: #fff; border-radius: 3px; padding: 1px 5px; font-size: 0.75rem; font-family: monospace; }
        .verse-interpretations-row { direction: rtl; display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; padding-top: 10px; border-top: 1px dashed #e5dfd3; font-family: sans-serif; font-size: 0.85rem; color: #333; }
        .interp-item { background: #fdfcf9; border-right: 3px solid #800000; padding: 6px 12px; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .highlight-word {
            background-color: #fff2cc; 
            border-bottom: 2px dashed #d99600; 
            padding: 0 4px;
            border-radius: 3px;
            display: inline-block;
        }
    </style>
<script src="./menu.js" defer></script>
<script src="./hebrew_accent_parser.js" defer></script>
</head>
<body>

    <div id="records-target">
        <p style="color: #888; font-style: italic;">Loading ornament concordance records...</p>
    </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const ornParam = urlParams.get('ornament') || '';
    const pitchParam = urlParams.get('pitch') || '';
    const bookParam = urlParams.get('book') || ''; // 1. Read book parameter from URL

    if (typeof HebrewAccentParser !== 'undefined') {
        const parser = new HebrewAccentParser();
        await parser.init('./hebrew_accent_dictionary.json');

        try {
            const resp = await fetch('./ornament_index.json');
            const data = await resp.json();

            // 2. Render records using current params
            parser.renderOrnamentRecords('#records-target', data, ornParam, pitchParam, bookParam);

            // 3. Attach change listener directly to the dropdown after render
            const selectEl = document.getElementById('book-filter-select');
            if (selectEl) {
                // Ensure current book is selected in dropdown
                if (bookParam) selectEl.value = bookParam;

                selectEl.addEventListener('change', (e) => {
                    const newBook = e.target.value;
                    const params = new URLSearchParams(window.location.search);
                    
                    if (newBook && newBook !== 'ALL') {
                        params.set('book', newBook);
                    } else {
                        params.delete('book');
                    }
                    
                    // Reload page with new ?book=... URL parameter
                    window.location.search = params.toString();
                });
            }
        } catch (err) {
            console.error('Error loading ornament index data:', err);
        }
    }
});
</script>
</body>
</html>
